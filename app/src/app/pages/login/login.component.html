<app-header></app-header>
<div class="login-container">
    <div class="login-form">
        <h1 class="login-title">Iniciar Sesión</h1>
        <p class="login-subtitle">Accede a tu cuenta de ServiceHub</p>

        <!-- El evento (ngSubmit) llama al método onSubmit() en el .ts -->
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <!-- [(ngModel)] conecta el input con el signal 'email' -->
                <input type="email" name="email" [(ngModel)]="email" #emailField="ngModel" required>
                <small class="error-msg" *ngIf="emailField.invalid && emailField.touched">
                    El correo es obligatorio
                </small>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" #passwordField="ngModel"
                    required>
                <small class="error-msg" *ngIf="passwordField.invalid && passwordField.touched">
                    La contraseña es obligatoria
                </small>
            </div>
            <p class="login-note">
                Puedes acceder usando <strong>admin@admin.com</strong> / <strong>admin</strong>
            </p>
            <button type="submit" class="login-button" [disabled]="loading() || loginForm.invalid">
                {{ loading() ? 'Ingresando...' : 'Ingresar' }}
            </button>
        </form>

        <!-- Sección para mostrar el resultado de la llamada a la API -->
        @if (error()) {
        <div class="api-response">
            {{ error() }}
        </div>
        }
    </div>
</div>
<app-footer></app-footer>
